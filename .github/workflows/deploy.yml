name: Deploy pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sincronizarea cu portofoliul agenției. 04:10 UTC = 07:10 vara la noi, deci
  # ce a schimbat Vlad seara e pe site înainte să se uite cineva dimineața.
  # Minutul nu e rotund dinadins: la fix, GitHub are vârf de cereri și pornirea
  # întârzie imprevizibil.
  schedule:
    - cron: "10 4 * * *"

permissions:
  contents: write # ca să poată comite datele proaspete
  pages: write
  id-token: write
  issues: write # ca să deschidă o notă când dispare o proprietate

# O singură publicare odată. Nu anulăm una în curs — dacă a ajuns la deploy,
# o lăsăm să termine, altfel site-ul poate rămâne pe jumătate încărcat.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --- Sincronizarea rulează doar la program sau la cerere ---
      # La un push obișnuit n-are rost: dacă tocmai ai schimbat codul, vrei să
      # vezi codul publicat, nu să aștepți încă o rundă de citit de la agenție.

      - name: Sincronizează portofoliul
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run sync

      - name: Adu fotografiile noi
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run media

      - name: Comite ce s-a schimbat
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "sincronizare"
          git config user.email "actions@github.com"
          git add src/lib/properties.generated.json src/lib/blur-data.ts public/media
          if git diff --cached --quiet; then
            echo "Nimic schimbat la agenție." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Portofoliu sincronizat cu listarea agenției"
            git push
            echo "Date actualizate din CRM." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Ce a dispărut din listare se lămurește singur: sincronizarea citește de pe
      # pagina anunțului dacă a fost tranzacție (vândut / închiriat), retragere sau
      # ștergere, iar site-ul arată sau ascunde în consecință. Aici doar se
      # raportează în rezumatul rulării. Se deschide o notă DOAR pentru ce n-a putut
      # fi citit — acolo site-ul ascunde proprietatea și are nevoie de un om.
      - name: Raportează ce s-a schimbat
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("sync-report.json")) process.exit(0);
            const r = JSON.parse(fs.readFileSync("sync-report.json", "utf8"));
            const lista = (titlu, xs, f) => xs && xs.length ? `### ${titlu}\n` + xs.map(f).join("\n") : null;
            const linii = [
              lista("Anunțuri noi", r.noi, n => `- ${n.titlu}`),
              lista("Vândute", r.vandute, s => `- ${s.titlu}`),
              lista("Închiriate", r.inchiriate, s => `- ${s.titlu}`),
              lista("Retrase sau șterse (nu mai apar pe site)", r.retrase, s => `- ${s.titlu} (${s.la})`),
              lista("Prețuri schimbate", r.preturi, p => `- ${p.id}: ${p.de_la} → ${p.la}`),
            ].filter(Boolean);
            fs.writeFileSync("summary.md", linii.join("\n\n"));
            if (r.neclare && r.neclare.length) {
              const corp = [
                "Proprietățile de mai jos au dispărut din listarea agenției, iar pagina lor nu spune ce s-a întâmplat (nici `SoldOut`, nici `Discontinued`, nici ștergere).",
                "",
                "Site-ul **le ascunde** până se lămurește — nu le scrie „vândut” din ghicit.",
                "",
                ...r.neclare.map(d => `- [ ] **${d.titlu}** (id \`${d.id}\`) — ${d.url}`),
                "",
                "Dacă s-a vândut, treci `status: \"vandut\"` (sau `\"inchiriat\"`) la proprietatea respectivă în `src/lib/property-overrides.ts`. Dacă se întâmplă des, probabil agenția și-a schimbat pagina — verifică `probeOutcome` din `scripts/sync-properties.mjs`.",
              ].join("\n");
              fs.writeFileSync("issue.md", corp);
            }
          '
          cat summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ -f issue.md ]; then
            gh issue create --title "Proprietăți dispărute din listare, fără rezultat clar" --body-file issue.md
          fi

      - run: npm run lint

      # Fără `NEXT_PUBLIC_BASE_PATH` de când site-ul are domeniu propriu.
      #
      # Cât era pe `calinnedelcu.github.io/website-vlad/`, tot ce pornea de la
      # rădăcină avea nevoie de prefixul `/website-vlad`. Pe vlad-nedelcu.ro
      # site-ul stă chiar în rădăcină, deci prefixul trebuie să fie gol — altfel
      # fiecare fotografie și fiecare fișier CSS ar fi căutat la
      # `/website-vlad/...`, care nu mai există.
      - name: Build static
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
